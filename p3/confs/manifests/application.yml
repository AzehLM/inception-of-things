apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p3
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AzehLM/inception-of-things.git
    targetRevision: feat/p3-gueberso
    path: p3/confs/manifests/wil-app
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      enabled: true # true by default if not specified
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
