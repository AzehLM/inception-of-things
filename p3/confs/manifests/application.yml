apiVersion: v1
kind: Application
metadata:
  name: p3
  namespace: dev
spec:
  ingressClassName: traefik
  rules:
  - host: argocd.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd
            port:
              number: 80
  - host: wil
    source:
      path: wil42/playground:v1 # https://hub.docker.com/r/wil42/playground
