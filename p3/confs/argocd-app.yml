apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playground
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/AzehLM/inception-of-things.git'
    targetRevision: feat/p3-lbuisson
    path: p3/manifests
  destination:
    server: https://kubernetes.default.svc
    # App deploys into the dev namespace
    namespace: dev
  syncPolicy:
    automated:
      # Auto-sync when ArgoCD detects changes in the repo
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true