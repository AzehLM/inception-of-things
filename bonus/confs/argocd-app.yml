apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playground
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://172.18.0.4:80/root/inception-of-things.git
    targetRevision: feat/bonus-lbuisson
    path: bonus/manifests
  destination:
    server: https://kubernetes.default.svc
    # App deploys into the dev namespace
    namespace: dev
  syncPolicy:
    automated:
      # Auto-sync when ArgoCD detects changes in the repo
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true