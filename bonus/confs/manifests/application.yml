apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p3-gitlab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitlab.gitlab.svc.cluster.local/root/p3.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc # Argo CD watches its own cluster
    namespace: dev
  syncPolicy:
    automated:
      enabled: true # true by default if not specified
      prune: true # remove cluster no longer present in Git
      selfHeal: true # reverts manual cluster changes back to Git state, making Git the only source of truth
    syncOptions:
      - CreateNamespace=true # replaces the p2 Ansible task creating the namespace (as well as avoiding namespace creation order issues)
